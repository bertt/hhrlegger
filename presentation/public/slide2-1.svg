<text x="526" y="140" text-anchor="middle" font-size="28" font-weight="700" fill="#f4f1ea">SQL</text>
<text x="1138" y="140" text-anchor="middle" font-size="28" font-weight="700" fill="#f4f1ea">HTTP</text>
<text x="220" y="400" text-anchor="middle" font-size="28" fill="#f2b24d" font-weight="700">Always-on, scales vertically</text>
<text x="832" y="400" text-anchor="middle" font-size="28" fill="#f2b24d" font-weight="700">Each request loads the server</text>
<text x="1444" y="400" text-anchor="middle" font-size="28" fill="#f2b24d" font-weight="700">Clients need OGC knowledge</text>
<text x="0" y="500" font-size="28" fill="#c9d3dc">Compute and hosting stay server-side at every step.</text>
